name: Validate

# Unprivileged validation for pull requests. No registry login, no package
# write access, and no secrets are used, so PR code never runs with elevated
# permissions. The same gates run before publishing in publish.yaml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # ubuntu-latest is a case-sensitive filesystem, so the filename/case tests
    # that are skipped on Windows execute there. Windows is kept for parity.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      # Build must precede the type check: scripts/start.ts imports
      # ../dist/server/entry.mjs, which only exists after a build.
      - name: Build
        run: bun run build

      - name: Type check
        run: bunx astro check
